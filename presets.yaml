# Presets for common use cases - load with: --preset draft

draft:
  # Fast iteration during story design
  resolution:
    fps: 24
  output:
    crf: 28
    preset: veryfast
  brand:
    intro_duration: 1.5
    outro_duration: 2.0
  timing:
    transition_duration_s: 0.3

social:
  # Optimized for TikTok/Reels/Shorts
  captions:
    font_size: 64
    bottom_margin: 300  # Extra space for UI
  brand:
    intro_duration: 2.0
    outro_duration: 3.0

premium:
  # Highest quality for final delivery
  resolution:
    fps: 60
  output:
    crf: 15
    preset: slow
    video_bitrate: "12M"
  ken_burns:
    zoom_max: 1.3