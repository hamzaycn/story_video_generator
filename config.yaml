# story_video_generator configuration
# Every visual/audio/timing tunable lives here. Values shown are the defaults.

resolution:
  width: 1080
  height: 1920
  fps: 30

ken_burns:
  zoom_min: 1.0    # no crop, full frame
  zoom_max: 1.22   # ~22% max zoom -- raise for more dramatic motion

captions:
  font_size: 58
  text_color: [255, 255, 255, 255]
  highlight_color: [255, 214, 64, 255]   # karaoke active-word color
  box_color: [0, 0, 0, 150]              # semi-transparent background bar
  box_radius: 28
  box_padding_x: 40
  box_padding_y: 26
  max_width_ratio: 0.86                  # fraction of canvas width text may use
  line_spacing: 14
  bottom_margin: 260                     # stays clear of TikTok/Reels/Shorts UI chrome
  top_margin: 200
  fade_frames: 6                         # frames to fade caption in/out
  karaoke: false                         # word-by-word highlight (approximate timing)

fonts:
  fonts_dir: assets/fonts
  # Override the default script -> font filename mapping here, e.g.:
  # script_map:
  #   latin: "MyBrandFont-Bold.ttf"
  script_map: {}

brand:
  app_name: "Kids AI Stories"
  primary_color: [91, 62, 224]
  secondary_color: [255, 176, 59]
  background_color: [18, 14, 38]
  text_color: [255, 255, 255]
  logo_path: assets/branding/logo.png
  qr_code_path: assets/branding/qr_code.jpg                    # optional: path to a QR code / app-store badge image
  cta_text: "Download the app to create your own stories!"
  title_font: null                       # falls back to per-script default if unset
  intro_duration: 3.0
  outro_duration: 4.0
  narrate_intro: true
  intro_narration_template: "{title}. A {category} story."

audio:
  music_duck_db: -18.0
  music_default_volume_db: -12.0
  music_fade_out_s: 2.0
  narration_gain_db: 0.0

output:
  # video_bitrate: "8M"
  # audio_bitrate: "192k"
  # crf: 18
  # preset: medium
  preset: veryfast   # was "medium" — biggest single lever, ~2-4x faster encode
  crf: 20    

timing:
  min_scene_duration_s: 3.0
  transition_duration_s: 0.5

paths:
  cache_dir: cache
  output_dir: output
  assets_dir: assets

default_voice: hannah
